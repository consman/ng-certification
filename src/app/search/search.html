<ng-container>
    <div class="container-fluid">
  
        <div class="well"> 
          <h2 data-test="addLocationBoxTitle">Enter a zipcode:</h2>
          <input #zipCodeEntry data-test="locationField" class="form-control" placeholder="Zipcode" type="text" id="addLocation" [(ngModel)]="newZip">
          <br>
          <button data-test="searchButton" (click)="search()" class="btn btn-primary" id="addLocationBtn">
            Add location
          </button>
        </div>
      
        @let lokations = this.weatherService.lokationsSig();
        @if(lokations && lokations.length > 0 ){
            @for(lokation of lokations; track lokation?.dt){                                
                  <app-location                                 
                  [lokationSig] = "lokation"
                  >
                  </app-location>              
            }
        }
        
    </div>

  </ng-container>
